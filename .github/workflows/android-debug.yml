name: Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Android configuration and wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'distributionUrl=.*gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q 'applicationId = "ai.nova.app"' app/build.gradle.kts
          ./gradlew --version
      - name: Test, lint, and build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/nova-gradle.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            compiler=$(grep -E '(^e: |error:|What went wrong:|FAILURE:|Execution failed)' "$RUNNER_TEMP/nova-gradle.log" | tail -n 20 || true)
            details=$(printf '%s ' "$compiler" "$(tail -n 8 "$RUNNER_TEMP/nova-gradle.log" | awk '{printf "%s ", $0}')" | sed 's/%/%25/g; s/:/%3A/g')
            echo "::error title=Gradle build failure::$details"
            exit "$result"
          fi
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-android-build-log
          path: ${{ runner.temp }}/nova-gradle.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish build summary
        if: always()
        run: |
          echo '## NOVA Android debug build' >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle exit: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if test -s app/build/outputs/apk/debug/app-debug.apk; then
            echo '- APK: `app/build/outputs/apk/debug/app-debug.apk` (uploaded as `nova-debug-apk`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- APK: not produced; inspect this job logs for the build failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
