services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    volumes:
      - nova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://nova:${POSTGRES_PASSWORD}@db:5432/nova
      NOVA_ADMIN_TOKEN: ${NOVA_ADMIN_TOKEN:?Set NOVA_ADMIN_TOKEN in local .env}
      NOVA_PROVIDER: ${NOVA_PROVIDER:-arena}
      NOVA_PROVIDER_BASE_URL: ${NOVA_PROVIDER_BASE_URL:-https://api.arena.ai/v1}
      NOVA_PROVIDER_API_KEY: ${NOVA_PROVIDER_API_KEY:-}
      NOVA_MODEL: ${NOVA_MODEL:-coding-router-preview}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  nova_pg:
